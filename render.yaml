services:
  - type: web
    name: music-editor-bot
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_ID
        value: "0"
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: TOKEN_ENC_KEY
        generateValue: true
      - key: IG_LOGIN_MODE
        value: "instagram"
      - key: IG_USER_ID
        value: "17841480703382946"
      - key: IG_ACCESS_TOKEN
        sync: false
      - key: IG_APP_ID
        value: "1426239392303916"
      - key: IG_APP_SECRET
        sync: false
      - key: IG_API_VERSION
        value: "v25.0"
      - key: LLM_PROVIDER
        value: "gemini"
      - key: LLM_MODEL
        value: "gemini-pro-latest"
      - key: GEMINI_API_KEY
        sync: false
      - key: CAPTION_LANG
        value: "uz"
      - key: DEFAULT_HASHTAGS
        value: "dasturlash,coding,python,programmer,ituzbekistan"
      - key: HASHTAG_LIMIT
        value: "5"
      - key: TZ
        value: "Asia/Tashkent"
      - key: MAX_POSTS_PER_DAY
        value: "2"
      - key: MIN_GAP_HOURS
        value: "4"
      - key: QUIET_HOURS
        value: "0-7"
      - key: TICK_SECRET
        generateValue: true
      - key: SCHEDULER_INTERVAL_SEC
        value: "30"
      - key: MAX_REEL_MB
        value: "19"
