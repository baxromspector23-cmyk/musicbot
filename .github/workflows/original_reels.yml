name: Original Reels (13:00 & 20:00 Tashkent)

on:
  schedule:
    - cron: "0 8,15 * * *"   # 13:00 and 20:00 Asia/Tashkent
  workflow_dispatch:

concurrency:
  group: autopilot-publish-lock
  cancel-in-progress: false

jobs:
  post:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Publish next original Reel
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          IG_DIRECT_SESSION_B64: ${{ secrets.IG_DIRECT_SESSION_B64 }}
          TZ: "Asia/Tashkent"
        run: python -m scripts.cloud_original_run

      - name: Save posting state
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/original_reels_state.json || true
          git diff --staged --quiet || (git commit -m "chore(reels): update posted state [skip ci]" && git pull --rebase origin main && git push origin main)
