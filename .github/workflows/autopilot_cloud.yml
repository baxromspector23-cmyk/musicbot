name: Cloud Autopilot Reels (5x Daily Rek)

on:
  schedule:
    # Every hour at :00 (UTC). The runner decides: during the 24h marathon
    # (2026-10-30 00:00 -> 2026-10-31 00:00 Tashkent) it posts every hour,
    # at 2026-10-31 00:xx it sends the Telegram stats report,
    # otherwise it only posts at the regular 5 daily slots.
    - cron: "3,18,33,48 * * * *"
  push:
    branches:
      - trigger-now
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode: publish or check-only"
        required: false
        default: "publish"

jobs:
  autopilot:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Setup FFmpeg (fast cache)
        continue-on-error: true
        uses: federicocarboni/setup-ffmpeg@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure FFmpeg
        run: |
          if ! command -v ffmpeg &> /dev/null; then
            echo "Installing FFmpeg via apt-get..."
            sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Cloud Autopilot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          IG_DIRECT_SESSION_B64: ${{ secrets.IG_DIRECT_SESSION_B64 }}
          TZ: "Asia/Tashkent"
        run: |
          if [ "${{ github.event.inputs.mode }}" = "check-only" ]; then
            python -m scripts.cloud_autopilot_run --check-only
          elif [ "${{ github.ref_name }}" = "trigger-now" ]; then
            python -m scripts.cloud_autopilot_run --force
          else
            python -m scripts.cloud_autopilot_run
          fi

      - name: Commit and push updated used codes
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add data/used_codes.json
          git diff --staged --quiet || (git commit -m "chore(autopilot): sync used video codes [skip ci]" && git push origin main)
