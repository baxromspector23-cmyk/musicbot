name: Cloud Autopilot Reels (5x Daily Rek)

on:
  schedule:
    # 09:00 Asia/Tashkent (04:00 UTC) - Ertalabki Rek #1
    - cron: "0 4 * * *"
    # 11:00 Asia/Tashkent (06:00 UTC) - Ertalabki Rek #2
    - cron: "0 6 * * *"
    # 12:00 Asia/Tashkent (07:00 UTC) - Kunduzgi Rek
    - cron: "0 7 * * *"
    # 18:30 Asia/Tashkent (13:30 UTC) - Kechki Rek #1
    - cron: "30 13 * * *"
    # 20:30 Asia/Tashkent (15:30 UTC) - Kechki Rek #2
    - cron: "30 15 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode: publish or check-only"
        required: false
        default: "publish"

jobs:
  autopilot:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Setup FFmpeg
        uses: federicocarboni/setup-ffmpeg@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Cloud Autopilot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          IG_DIRECT_SESSION_B64: ${{ secrets.IG_DIRECT_SESSION_B64 }}
          TZ: "Asia/Tashkent"
        run: |
          if [ "${{ github.event.inputs.mode }}" = "check-only" ]; then
            python -m scripts.cloud_autopilot_run --check-only
          else
            python -m scripts.cloud_autopilot_run
          fi

      - name: Commit and push updated used codes
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add data/used_codes.json
          git diff --staged --quiet || (git commit -m "chore(autopilot): sync used video codes [skip ci]" && git push origin main)
