name: Cloud Autopilot Reels (3x Daily Rek)

on:
  schedule:
    # Off-peak 15m cron (3,18,33,48) to bypass GitHub :00 cron lag; skips in 1s outside 11:00, 15:00, 20:00 Tashkent
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode: publish or check-only"
        required: false
        default: "publish"

concurrency:
  group: autopilot-publish-lock
  cancel-in-progress: false

jobs:
  autopilot:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check posting hour (Tashkent)
        id: hour_check
        run: |
          HOUR=$(TZ="Asia/Tashkent" date +%H)
          echo "Current Tashkent hour: $HOUR (event: ${{ github.event_name }})"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$HOUR" != "00" ] && [ "$HOUR" != "08" ] && [ "$HOUR" != "11" ] && [ "$HOUR" != "15" ] && [ "$HOUR" != "20" ]; then
            echo "should_run=false" >> $GITHUB_OUTPUT
          else
            echo "should_run=true" >> $GITHUB_OUTPUT
          fi

      - name: Checkout repository
        if: steps.hour_check.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        if: steps.hour_check.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Setup FFmpeg (fast cache)
        if: steps.hour_check.outputs.should_run == 'true'
        continue-on-error: true
        uses: federicocarboni/setup-ffmpeg@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure FFmpeg
        if: steps.hour_check.outputs.should_run == 'true'
        run: |
          if ! command -v ffmpeg &> /dev/null; then
            echo "Installing FFmpeg via apt-get..."
            sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version

      - name: Install Python dependencies
        if: steps.hour_check.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Cloud Autopilot
        if: steps.hour_check.outputs.should_run == 'true'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          IG_DIRECT_SESSION_B64: ${{ secrets.IG_DIRECT_SESSION_B64 }}
          TZ: "Asia/Tashkent"
        run: |
          if [ "${{ github.event.inputs.mode }}" = "check-only" ]; then
            python -m scripts.cloud_autopilot_run --check-only
          elif [ "${{ github.event.inputs.mode }}" = "force" ] || [ "${{ github.ref_name }}" = "trigger-now" ]; then
            python -m scripts.cloud_autopilot_run --force
          else
            python -m scripts.cloud_autopilot_run
          fi

      - name: Commit and push updated used codes
        if: steps.hour_check.outputs.should_run == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add data/used_codes.json
          git diff --staged --quiet || (git commit -m "chore(autopilot): sync used video codes [skip ci]" && git push origin main)
